<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alert</title>
  <style>
    p {
      font-size: 25px;
      width: 800px;
      margin: auto;
      text-align: justify;
      font-family: arial;
    }

    .box {
      width: 500px;
      height: 400px;
      background: crimson;
      position: relative;
      left: 0;
      display: none;
    }
    .color{
      width:800px;
      height: 320px;
      background:grey;
      border:2px solid brown;
      margin:100px auto;
      border-radius:10px;
      padding:5px;
      display: flex;
      flex-direction: column;
      gap:5px;
      box-shadow: 0px 2px 10px;
    }
    .color div{
      width:100%;
      height:50%;
      display: flex;
      justify-content: space-between;
      align-items:center;
    }
    .color div button{
      width:150px;
      height: 150px;
      font-size:20px;
      cursor: pointer;
      text-transform: uppercase;
      border-radius: 5%;
      border: none;
      box-shadow: 0px 5px 5px;
    }
    .color div button:active{
      cursor: grabbing;
    }
  </style>
</head>

<body>
  <form name="myForm">
    Name: <input type="number" id="fname" />
    <input type="submit" value="Submit" id="btn" />
  </form>
  <div class="color">
    <div class="first-row">
      <button type="button">red</button>
      <button type="button">green</button>
      <button type="button">blue</button>
      <button type="button">yellow</button>
      <button type="button">purple</button>
    </div>
    <div class="second-row">
      <button type="button">peru</button>
      <button type="button">hotpink</button>
      <button type="button">dodgerblue</button>
      <button type="button">tomato</button>
      <button type="button">chocolate</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
